# Tests on every push and pull request; on a version tag (v0.2.0, ...) also builds the .deb and the
# universal tarball and attaches them to a GitHub Release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # to create the release on tags

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 dbus-x11 rsync

      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .

      - name: Tests
        run: dbus-run-session -- env QT_QPA_PLATFORM=offscreen .venv/bin/python -m unittest discover -s tests -t . -v

      - name: Build packages
        run: packaging/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
