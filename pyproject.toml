[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-island"
version = "0.3.1"
description = "A dynamic-island style status pill for Linux desktops"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "jeepney>=0.8"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.scripts]
linux-island = "linux_island.app:main"

[tool.setuptools.packages.find]
include = ["linux_island*"]

[tool.setuptools.package-data]
linux_island = ["qml/*.qml", "qml/*.js", "data/*"]
